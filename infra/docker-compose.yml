name: amel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amel
      POSTGRES_PASSWORD: amel_dev_password
      POSTGRES_DB: amel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amel -d amel"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/create_topics.sh"]
    volumes:
      - ./kafka/create_topics.sh:/init/create_topics.sh:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  migrate:
    build:
      context: ..
      dockerfile: infra/db/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: amel
      MINIO_ROOT_PASSWORD: amel_dev_password
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/create_buckets.sh"]
    volumes:
      - ./minio/create_buckets.sh:/init/create_buckets.sh:ro
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: amel
      MINIO_ROOT_PASSWORD: amel_dev_password

  airflow:
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://amel:amel_dev_password@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # AMEL's own database (not Airflow's metadata DB) — read by DAG tasks via amel_db.
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: amel
      AWS_SECRET_ACCESS_KEY: amel_dev_password
      AWS_REGION: us-east-1
      PIPELINE_STAGING_DIR: /opt/airflow/staging
      FEAST_SERVER_URL: http://feast-server:6566
      HIGGS_PIPELINE_SCHEDULE: ${HIGGS_PIPELINE_SCHEDULE:-*/5 * * * *}
      VALIDATION_MAX_INVALID_FRACTION: ${VALIDATION_MAX_INVALID_FRACTION:-0.05}
      LOG_LEVEL: info
    command: standalone
    volumes:
      - airflow-staging:/opt/airflow/staging
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  source-simulator:
    build:
      context: ..
      dockerfile: services/source_simulator/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATA_DIR: /data
      HIGGS_MAX_ROWS: ${HIGGS_MAX_ROWS:-500000}
      # After a restart, set to (max landed index + 1) or every replayed
      # entity_id is deduped and no new data reaches curated (RUNBOOKS.md).
      HIGGS_START_INDEX: ${HIGGS_START_INDEX:-0}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-100}
      KAFKA_MESSAGE_TIMEOUT_MS: ${KAFKA_MESSAGE_TIMEOUT_MS:-30000}
      DUPLICATE_RATE: ${DUPLICATE_RATE:-0.01}
      INVALID_EVENT_RATE: ${INVALID_EVENT_RATE:-0.002}
      LABEL_DELAY_SECONDS: ${LABEL_DELAY_SECONDS:-10}
      BURST_MODE: ${BURST_MODE:-false}
    volumes:
      - ../data/raw:/data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  stream-ingestor:
    build:
      context: ..
      dockerfile: services/stream_ingestor/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  feast-apply:
    build:
      context: ..
      dockerfile: infra/feast/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["feast", "apply"]
    mem_limit: 1g

  # Always-on (deliberately — see DECISIONS.md ADR-0005): the scheduled
  # DAG's update_feature_store task POSTs /materialize here every 5 min,
  # and this keeps Feast's dependency tree out of the Airflow image. One
  # idle uvicorn process (~250 MB); the hard cap means a runaway
  # materialization is OOM-killed inside this container, not WSL2.
  feast-server:
    build:
      context: ..
      dockerfile: infra/feast/Dockerfile
    depends_on:
      feast-apply:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["feast", "serve", "--host", "0.0.0.0", "--port", "6566", "--no-access-log"]
    ports:
      - "6566:6566"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6566/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  feast-materialize:
    profiles: ["feast-demo"]
    build:
      context: ..
      dockerfile: infra/feast/Dockerfile
    depends_on:
      feast-apply:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
    # Chunked, not `feast materialize-incremental`: the plain CLI loads
    # the whole window into memory and was OOM-killed at 12 GB RSS over
    # the ~885k-row curated table (RUNBOOKS.md). Resumes from the
    # registry, so re-running is cheap.
    command: ["python", "scripts/materialize.py"]
    mem_limit: 2g

  feast-demo:
    profiles: ["feast-demo"]
    build:
      context: ..
      dockerfile: infra/feast/Dockerfile
    depends_on:
      feast-apply:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
    command: ["python", "scripts/demo_retrieval.py"]
    mem_limit: 2g

volumes:
  postgres-data:
  kafka-data:
  minio-data:
  airflow-staging:
  redis-data:
