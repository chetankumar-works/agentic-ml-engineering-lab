name: amel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amel
      POSTGRES_PASSWORD: amel_dev_password
      POSTGRES_DB: amel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amel -d amel"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/create_topics.sh"]
    volumes:
      - ./kafka/create_topics.sh:/init/create_topics.sh:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  migrate:
    build:
      context: ..
      dockerfile: infra/db/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: amel
      MINIO_ROOT_PASSWORD: amel_dev_password
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/create_buckets.sh"]
    volumes:
      - ./minio/create_buckets.sh:/init/create_buckets.sh:ro
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: amel
      MINIO_ROOT_PASSWORD: amel_dev_password

  airflow:
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://amel:amel_dev_password@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Airflow 3 ships its own OpenTelemetry integration: DAG-run and
      # task spans to the same collector (Milestone 6).
      AIRFLOW__TRACES__OTEL_ON: "true"
      # Airflow 3.3 reads the standard OTel env vars; [traces] otel_host/
      # otel_port are legacy backcompat.
      # Airflow's exporter selection ignores OTEL_EXPORTER_OTLP_PROTOCOL and
      # uses gRPC, so point it at the collector's gRPC receiver (4317).
      OTEL_SERVICE_NAME: airflow
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      # AMEL's own database (not Airflow's metadata DB) — read by DAG tasks via amel_db.
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: amel
      AWS_SECRET_ACCESS_KEY: amel_dev_password
      AWS_REGION: us-east-1
      PIPELINE_STAGING_DIR: /opt/airflow/staging
      FEAST_SERVER_URL: http://feast-server:6566
      HIGGS_PIPELINE_SCHEDULE: ${HIGGS_PIPELINE_SCHEDULE:-*/5 * * * *}
      VALIDATION_MAX_INVALID_FRACTION: ${VALIDATION_MAX_INVALID_FRACTION:-0.05}
      LOG_LEVEL: info
    command: standalone
    volumes:
      - airflow-staging:/opt/airflow/staging
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  source-simulator:
    build:
      context: ..
      dockerfile: services/source_simulator/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATA_DIR: /data
      HIGGS_MAX_ROWS: ${HIGGS_MAX_ROWS:-500000}
      # After a restart, set to (max landed index + 1) or every replayed
      # entity_id is deduped and no new data reaches curated (RUNBOOKS.md).
      HIGGS_START_INDEX: ${HIGGS_START_INDEX:-0}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-100}
      KAFKA_MESSAGE_TIMEOUT_MS: ${KAFKA_MESSAGE_TIMEOUT_MS:-30000}
      DUPLICATE_RATE: ${DUPLICATE_RATE:-0.01}
      INVALID_EVENT_RATE: ${INVALID_EVENT_RATE:-0.002}
      LABEL_DELAY_SECONDS: ${LABEL_DELAY_SECONDS:-10}
      BURST_MODE: ${BURST_MODE:-false}
    volumes:
      - ../data/raw:/data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  stream-ingestor:
    build:
      context: ..
      dockerfile: services/stream_ingestor/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  feast-apply:
    build:
      context: ..
      dockerfile: infra/feast/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["feast", "apply"]
    mem_limit: 1g

  # Always-on (deliberately — see DECISIONS.md ADR-0005): the scheduled
  # DAG's update_feature_store task POSTs /materialize here every 5 min,
  # and this keeps Feast's dependency tree out of the Airflow image. One
  # idle uvicorn process (~250 MB); the hard cap means a runaway
  # materialization is OOM-killed inside this container, not WSL2.
  feast-server:
    build:
      context: ..
      dockerfile: infra/feast/Dockerfile
    depends_on:
      feast-apply:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # `opentelemetry-instrument` auto-instruments Feast's FastAPI app and
    # its redis client, so /predict/entity traces continue into
    # feast-server -> Redis (Milestone 6).
    command: ["opentelemetry-instrument", "feast", "serve", "--host", "0.0.0.0", "--port", "6566", "--no-access-log"]
    environment:
      OTEL_SERVICE_NAME: feast_server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "6566:6566"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6566/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # MLflow tracking server + registry (Milestone 4, DECISIONS.md ADR-0006).
  # Always-on: training logs to it and inference (Milestone 5) resolves
  # the champion alias through it. Memory-capped like every other
  # non-core container on this 15 GB host.
  mlflow:
    build:
      context: ..
      dockerfile: infra/mlflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - "--backend-store-uri=postgresql+psycopg2://amel:amel_dev_password@postgres:5432/mlflow"
      - "--artifacts-destination=s3://mlflow"
      - "--serve-artifacts"
      - "--workers=2"
      # MLflow 3 rejects unknown Host headers (DNS-rebinding guard); the
      # in-network name and the host-published port must both be allowed.
      - "--allowed-hosts=mlflow:5000,localhost:5000,127.0.0.1:5000"
    environment:
      # MLflow 3 also starts a job runner + two huey consumers (~500 MB)
      # for its server-side jobs feature, which nothing here uses.
      # With 4 workers the default footprint was 1 GB.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: amel
      AWS_SECRET_ACCESS_KEY: amel_dev_password
      AWS_REGION: us-east-1
    ports:
      - "5000:5000"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Inference API (Milestone 5): serves models:/higgs_decision_tree@champion.
  # Loads the model once at start-up (needs mlflow up *then*), caches it,
  # refreshes only via POST /model/refresh or the optional poll.
  inference-api:
    build:
      context: ..
      dockerfile: apps/inference_api/Dockerfile
    depends_on:
      mlflow:
        condition: service_healthy
      feast-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
      INFERENCE_MLFLOW_TRACKING_URI: http://mlflow:5000
      INFERENCE_FEAST_SERVER_URL: http://feast-server:6566
      INFERENCE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INFERENCE_MODEL_REFRESH_SECONDS: ${INFERENCE_MODEL_REFRESH_SECONDS:-0}
      INFERENCE_ADMIN_TOKEN: ${INFERENCE_ADMIN_TOKEN:-dev-admin-token}
      # MLflow's client retries 7x with exponential backoff by default —
      # a refresh during an MLflow outage blocked for minutes. The cached
      # model keeps serving regardless; the *refresh* should fail fast.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
    ports:
      - "8003:8003"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- Observability (Milestone 6, DECISIONS.md ADR-0008) -------------------
  # Every first-party service sends OTLP to the collector; Prometheus
  # scrapes /metrics directly. All five are memory-capped and keep 24h.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "4318:4318"   # OTLP/HTTP from host-run tools (optional)
    mem_limit: 256m

  tempo:
    image: grafana/tempo:latest
    command:
      - "-config.file=/etc/tempo.yaml"
      - "-backend-scheduler.provider.work.compaction.block-retention=24h"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (scripts/smoke_milestone6.py, debugging)
    mem_limit: 512m

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"   # Loki HTTP API (scripts/smoke_milestone6.py, debugging)
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2d"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 512m

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 64m

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: amel_dev_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    ports:
      - "3000:3000"
    mem_limit: 256m

  # One-shot training run (Milestone 4): `make train`, `make promote`.
  train:
    profiles: ["train"]
    build:
      context: ..
      dockerfile: infra/training/Dockerfile
    depends_on:
      mlflow:
        condition: service_healthy
      feast-apply:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
      TRAINING_MLFLOW_TRACKING_URI: http://mlflow:5000
      TRAINING_MAX_ROWS: ${TRAINING_MAX_ROWS:-200000}
      TRAINING_AS_OF: ${TRAINING_AS_OF:-}
      TRAINING_MAX_DEPTH: ${TRAINING_MAX_DEPTH:-8}
      TRAINING_GIT_SHA: ${GIT_SHA:-}
    mem_limit: 3g

  feast-materialize:
    profiles: ["feast-demo"]
    build:
      context: ..
      dockerfile: infra/feast/Dockerfile
    depends_on:
      feast-apply:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
    # Chunked, not `feast materialize-incremental`: the plain CLI loads
    # the whole window into memory and was OOM-killed at 12 GB RSS over
    # the ~885k-row curated table (RUNBOOKS.md). Resumes from the
    # registry, so re-running is cheap.
    command: ["python", "scripts/materialize.py"]
    mem_limit: 2g

  feast-demo:
    profiles: ["feast-demo"]
    build:
      context: ..
      dockerfile: infra/feast/Dockerfile
    depends_on:
      feast-apply:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
    command: ["python", "scripts/demo_retrieval.py"]
    mem_limit: 2g

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
  postgres-data:
  kafka-data:
  minio-data:
  airflow-staging:
  redis-data:
