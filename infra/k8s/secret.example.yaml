# TEMPLATE ONLY — never commit a filled-in copy. `make k8s-secret` creates
# the real Secret from environment variables / .env (kubectl create secret
# generic amel-secrets ...). Values below are the Compose dev defaults so
# a fresh checkout works; production would use a secret manager
# (SECURITY.md).
apiVersion: v1
kind: Secret
metadata:
  name: amel-secrets
  namespace: amel
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://amel:amel_dev_password@postgres:5432/amel
  INFERENCE_ADMIN_TOKEN: dev-admin-token
  AWS_ACCESS_KEY_ID: amel
  AWS_SECRET_ACCESS_KEY: amel_dev_password
