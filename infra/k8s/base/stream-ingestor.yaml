apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-ingestor
  namespace: amel
  labels: { app: stream-ingestor, app.kubernetes.io/part-of: amel }
spec:
  replicas: 1   # up to 6 useful (partitions per topic) — Milestone 10's KEDA experiment
  selector:
    matchLabels: { app: stream-ingestor }
  template:
    metadata:
      labels: { app: stream-ingestor }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
      containers:
        - name: stream-ingestor
          image: amel-stream-ingestor:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8002 }]
          env:
            # one span per Kafka message at 100% OOM-looped Tempo; sample (ADR-0010)
            - { name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio }
            - { name: OTEL_TRACES_SAMPLER_ARG, value: "0.02" }
          envFrom:
            - configMapRef: { name: amel-config }
            - secretRef: { name: amel-secrets }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 384Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }   # 503 when the consume loop died
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }    # 503 without partitions / after a rejected commit
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stream-ingestor
  namespace: amel
spec:
  type: NodePort
  selector: { app: stream-ingestor }
  ports:
    - { name: http, port: 8002, targetPort: http, nodePort: 30002 }
