# OpenTelemetry Collector (DECISIONS.md ADR-0008). Every first-party
# service sends OTLP/HTTP here; nothing talks to Tempo/Loki directly.
# - traces  -> Tempo (OTLP gRPC)
# - logs    -> Loki (native OTLP endpoint, Loki 3.x)
# - metrics -> derived from spans (spanmetrics: request rate/errors/
#              duration per service+route) and exposed for Prometheus
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 2s
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 40

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s]
    dimensions:
      - name: http.route
      - name: messaging.destination.name
    metrics_flush_interval: 15s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, spanmetrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
  telemetry:
    metrics:
      level: basic
