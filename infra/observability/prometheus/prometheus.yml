# Scrapes every first-party /metrics endpoint plus the collector's
# span-derived RED metrics and Kafka consumer lag.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: source_simulator
    static_configs: [{ targets: ["source-simulator:8001"] }]
  - job_name: stream_ingestor
    static_configs: [{ targets: ["stream-ingestor:8002"] }]
  - job_name: inference_api
    static_configs: [{ targets: ["inference-api:8003"] }]
  - job_name: otel_spanmetrics
    static_configs: [{ targets: ["otel-collector:8889"] }]
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
