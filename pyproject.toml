[project]
name = "amel"
version = "0.1.0"
description = "Agentic ML Engineering Lab — an executable, learning-oriented production ML platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pandas-stubs>=2.2",
]

[tool.uv.workspace]
members = ["libs/*", "services/*", "ml/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "apps", "sdk", "ml", "libs", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = false  # tightened per-package as real services land

# boto3/botocore ship no type stubs and boto3-stubs is a heavy,
# generated-per-service dependency not worth pulling in for the couple
# of S3 calls amel_lake makes — see object_store.py's own `Any` client type.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "sklearn.*"]
ignore_missing_imports = true

# Airflow itself is deliberately NOT a workspace dependency (see
# DECISIONS.md ADR-0002/ARCHITECTURE.md — it lives in its own image with
# its own strict pins). infra/airflow/dags/higgs_pipeline.py imports it;
# treating it as untyped rather than installing it into the shared dev
# venv keeps that isolation while still type-checking the rest of the file.
[[tool.mypy.overrides]]
module = ["airflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "libs", "services", "infra/airflow", "ml"]
addopts = "-ra"

[tool.uv]
# Virtual project: no installable top-level package yet. services/apps/sdk
# get their own pyproject.toml (or are added here) as first-party packages
# land in later milestones.
package = false
