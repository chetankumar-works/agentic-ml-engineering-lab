[project]
name = "amel-common"
version = "0.1.0"
description = "Shared schemas, logging, and settings helpers used across AMEL services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amel_common"]
