[project]
name = "amel-lake"
version = "0.1.0"
description = "Object storage (MinIO/S3), Parquet, and data-validation helpers for the batch pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "amel-common",
    "amel-db",
    "boto3>=1.35",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pandera[pandas]>=0.20",
]

[tool.uv.sources]
amel-common = { workspace = true }
amel-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amel_lake"]
