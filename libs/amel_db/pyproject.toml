[project]
name = "amel-db"
version = "0.1.0"
description = "SQLAlchemy models, session helpers, and Alembic migrations for AMEL's PostgreSQL schemas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amel_db"]
