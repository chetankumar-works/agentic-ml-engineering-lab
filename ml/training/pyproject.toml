[project]
name = "amel-training"
version = "0.1.0"
description = "Reproducible DecisionTreeClassifier training against Feast's offline path, tracked and registered in MLflow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "amel-common",
    "amel-db",
    "feast[postgres,redis]>=0.66",
    "mlflow>=3.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
]

[project.scripts]
amel-train = "amel_training.cli:main"

[tool.uv.sources]
amel-common = { workspace = true }
amel-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amel_training"]
