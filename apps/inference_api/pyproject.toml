[project]
name = "inference-api"
version = "0.1.0"
description = "FastAPI inference service: serves the MLflow champion DecisionTree over raw or Feast-online features"
requires-python = ">=3.12,<3.13"
dependencies = [
    "amel-common",
    "amel-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "mlflow>=3.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "confluent-kafka>=2.6",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.uv.sources]
amel-common = { workspace = true }
amel-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_api"]
