[project]
name = "source-simulator"
version = "0.1.0"
description = "Streams the UCI HIGGS dataset into Kafka as realistic, imperfect feature/label event traffic"
requires-python = ">=3.12,<3.13"
dependencies = [
    "amel-common",
    "confluent-kafka>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
    "requests>=2.32",
]

[tool.uv.sources]
amel-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/source_simulator"]
