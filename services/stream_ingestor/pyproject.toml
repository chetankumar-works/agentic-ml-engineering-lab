[project]
name = "stream-ingestor"
version = "0.1.0"
description = "Kafka consumer group that idempotently persists HIGGS feature/label events into PostgreSQL"
requires-python = ">=3.12,<3.13"
dependencies = [
    "amel-common",
    "amel-db",
    "confluent-kafka>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
]

[tool.uv.sources]
amel-common = { workspace = true }
amel-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_ingestor"]
